name: Update latest.json

on:
  schedule:
    - cron: "0 * * * *"   # hourly
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run updater
        run: python update.py

      - name: Show files (debug)
        run: |
          echo "Repo root:"
          ls -la
          echo "Latest preview:"
          test -f latest.json && head -n 30 latest.json || echo "latest.json missing"

      - name: Commit results
        run: |
          git config user.name "invest-game-bot"
          git config user.email "invest-game-bot@users.noreply.github.com"
          git add latest.json || true
          git add state.json  || true
          git commit -m "Update latest.json" || echo "No changes to commit"
          git push
