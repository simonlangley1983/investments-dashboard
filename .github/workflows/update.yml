name: update

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes across US market hours, allowing for DST shifts.
    # Covers 09:30-16:00 New York time in both summer and winter.
    - cron: "*/15 13-21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-dashboard-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run updater
        run: |
          python update.py

      - name: Show key outputs (debug)
        run: |
          echo "---- portfolios.json ----"
          cat portfolios.json || true
          echo "---- latest.json ----"
          cat latest.json || true
          echo "---- history.json ----"
          cat history.json || true
          echo "---- git status ----"
          git status --porcelain

      - name: Commit and push changes
        run: |
          set -e
          git config user.name "invest-game-bot"
          git config user.email "actions@users.noreply.github.com"

          # Always stage the generated outputs
          git add latest.json history.json state.json

          # If there are no changes, stop cleanly
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update dashboard data"
          git push
