name: Update investment dashboard data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"   # hourly

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run updater
        run: |
          python update.py

      - name: Show key outputs (debug)
        run: |
          echo "---- portfolios.json ----"
          cat portfolios.json || true
          echo "---- latest.json ----"
          head -n 60 latest.json || true
          echo "---- history.json ----"
          cat history.json || true
          echo "---- git status ----"
          git status --porcelain

      - name: Commit and push changes
        run: |
          git config user.name "invest-game-bot"
          git config user.email "actions@users.noreply.github.com"
          git add latest.json history.json state.json
          git commit -m "Update dashboard data" || echo "No changes to commit"
          git push
